#:schema https://raw.githubusercontent.com/yunanwg/brilliant-CV/main/metadata.toml.schema.json

# Set the output language
# INFO: value must matches folder suffix; i.e "zh" -> "./modules_zh"
language = "en"

# Which profile the LIVE EDITOR PREVIEW shows (Tinymist / VS Code), since the
# preview cannot pass --input. Set to "full", "college", or any profile defined
# at the bottom of this file, then save — the preview updates immediately.
# ./compile.sh always overrides this, so builds are unaffected.

preview_profile = "college"

[layout]
    # Optional values: skyblue, red, nephritis, concrete, darknight
    # You can also use a custom color by hex code i.e. "#1E90FF"
    awesome_color = "skyblue"

    # Skips are for controlling the spacing between sections and entries
    before_section_skip = "0pt"
    before_entry_skip = "1pt"
    before_entry_description_skip = "0pt"

    # Optional: sets paper size and margins. Possible values: a4 (default), us-letter
    paper_size = "a4"

    # Optional: sets the width of the right column of a cvEntry. If not set, values known to work well are used
    #date_width = "3.6cm"

    [layout.fonts]
        regular_fonts = ["Source Sans Pro", "Source Sans 3"]
        header_font = "Roboto"

        # regular_fonts = ["Arial"]
        # header_font = "Arial"

    [layout.header]
        # Optional values: left, center, right
        header_align = "left"

        # Decide if you want to display profile photo or not
        display_profile_photo = false
        # Radius in % to clip profile photo at
        profile_photo_radius = "50%"
        info_font_size = "10pt"

    [layout.entry]
        # Decide if you want to put your company in bold or your position in bold
        display_entry_society_first = true

        # Decide if you want to display organisation logo or not
        display_logo = true

    [layout.footer]
        # Decide if you want to display page counter or not
        display_page_counter = false

        # Decide if you want to display the footer or not
        display_footer = false


[inject]
    # Decide if you want to inject AI prompt or not
    inject_ai_prompt = false

    # Decide if you want to inject keywords or not
    inject_keywords = true
    injected_keywords_list = [
    "Embedded Systems", "Bare-Metal Programming",
    "ARM Cortex-M", "Cortex-M4", "Cortex-M7",
    "STM32", "NXP i.MX RT",
    "Device Drivers", "Linker Script", "Memory Map", "Interrupts", "DMA",
    "UART", "SPI", "I2C", "ADC", "GPIO",
    "Linux",
    "Docker", "Git", "Make", "CMake", "Meson", "Cross-compilation",
    "Debugging", "GDB", "OpenOCD", "SWD",
    "MCUXpresso", "STM32CubeIDE", "GCC",
    "Embedded C", "C", "Python", "SQL"
]


